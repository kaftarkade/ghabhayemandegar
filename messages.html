    <!-- Appwrite -->

    <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>

<script>
/* =========================================================
   APPWRITE MESSAGES
========================================================= */

const messagesClient = new Appwrite.Client();

messagesClient
    .setEndpoint("https://cloud.appwrite.io/v1")
    .setProject("6ac3b38f000976364cad");

const messagesDatabase =
    new Appwrite.Databases(messagesClient);

const MESSAGES_DATABASE_ID =
    "6ac3b50f001bdd8488ff";

const MESSAGES_TABLE_ID =
    "6ac3b51800052942e6b5";
</script>

<script>
/* =========================================================
   SEND MESSAGE
========================================================= */

const messageInput = document.getElementById("messageInput");
const sendMessage = document.getElementById("sendMessage");

sendMessage.addEventListener("click", async function () {

    const text = messageInput.value.trim();

    if (!text) return;

    const user = JSON.parse(localStorage.getItem("memoryUser"));

    if (!user) {
        alert("ابتدا وارد حساب کاربری شوید.");
        return;
    }

    try {

        const tablesDB = new Appwrite.TablesDB(messagesClient);

        await tablesDB.createRow({
            databaseId: MESSAGES_DATABASE_ID,
            tableId: MESSAGES_TABLE_ID,
            rowId: Appwrite.ID.unique(),

            data: {
                name: user.name,
                phone: user.phone,
                joindate: user.joinDate || "",
                userid: user.phone,
                username: user.name,
                massage: text,
                createdat: new Date().toISOString(),
                reciever: "all"
            }
        });

        messageInput.value = "";

        alert("پیام ارسال شد.");

} catch (error) {

    console.error("APPWRITE ERROR:", error);

    alert(
        "خطا:\n" +
        (error.message || "خطای نامشخص") +
        "\n\nCode: " +
        (error.code || "-")
    );

} 

});
</script>

<script>
/* =========================================================
   LOAD SAVED MESSAGES
========================================================= */

const messagesArea = document.getElementById("messagesArea");

async function loadMessages() {

    try {

        const tablesDB = new Appwrite.TablesDB(messagesClient);

        const response = await tablesDB.listRows({
            databaseId: MESSAGES_DATABASE_ID,
            tableId: MESSAGES_TABLE_ID,
            queries: [
                Appwrite.Query.orderAsc("$sequence")
            ]
        });

        messagesArea.innerHTML = "";

        response.rows.forEach(function(row) {

            const message = document.createElement("div");

            message.className = "message";

            message.textContent = row.massage || "";

            messagesArea.appendChild(message);

        });

    } catch (error) {

        console.error("خطا در دریافت پیام‌ها:", error);

    }
}

loadMessages();
</script>
