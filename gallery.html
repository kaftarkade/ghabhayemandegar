<!-- =========================================================
     PROFESSIONAL LIGHTBOX
========================================================= -->

<div
    class="lightbox"
    id="lightbox"
    aria-hidden="true"
>


    <!-- دکمه بستن -->

    <button
        type="button"
        class="lightbox-close"
        id="lightboxClose"
        aria-label="بستن"
    >
        ×
    </button>



    <!-- عکس قبلی -->

    <button
        type="button"
        class="lightbox-nav lightbox-prev"
        id="lightboxPrev"
        aria-label="عکس قبلی"
    >
        ‹
    </button>



    <!-- محتوای اصلی -->

    <div class="lightbox-content">


        <div class="lightbox-image-wrap">

            <img
                id="lightboxImage"
                src=""
                alt="نمایش عکس"
                draggable="false"
            >

        </div>



        <!-- اطلاعات پایین عکس -->

        <div class="lightbox-info">

            <span id="lightboxNumber">
                1 / 8
            </span>


            <button
                type="button"
                id="lightboxFavorite"
                class="lightbox-favorite"
                aria-label="افزودن به موردعلاقه‌ها"
            >
                ☆
            </button>

        </div>


    </div>



    <!-- عکس بعدی -->

    <button
        type="button"
        class="lightbox-nav lightbox-next"
        id="lightboxNext"
        aria-label="عکس بعدی"
    >
        ›
    </button>


</div>
