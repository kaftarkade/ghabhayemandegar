<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیام‌رسان | قاب‌های ماندگار</title>

    <style>
        @font-face {
            font-family: "VazirmatnBlack";
            src: url("fonts/Vazirmatn-Black.woff2") format("woff2");
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            background: #09090d;
            color: #fff;
            font-family: "VazirmatnBlack", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            text-align: center;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            transition: background 0.2s;
        }

        .back-button:hover {
            background: rgba(168, 85, 247, 0.2);
        }

        .message {
            margin: 0;
            line-height: 2;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-button">← بازگشت</a>

    <p class="message">
        این بخش در حال آماده‌سازی است ♻️
        <br>
        لطفاً تا آماده‌سازی کامل، صبور باشید...
    </p>

</body>
</html>
